<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAROWO CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06061a">
  <link rel="icon" href="/favicon.ico?v=20260331" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png?v=20260331">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png?v=20260331">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20260331">
  <link rel="manifest" href="/site.webmanifest?v=20260331">
  <style>
    :root {
      --navy: #06061a;
      --navy2: #0b0d2b;
      --red: #e8000d;
      --line: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.88);
      --dim: rgba(255, 255, 255, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(232, 0, 13, 0.14), transparent 22%),
        radial-gradient(circle at 82% 24%, rgba(232, 0, 13, 0.12), transparent 26%),
        linear-gradient(180deg, #07081f 0%, #050617 100%);
    }

    .admin-shell {
      width: min(560px, 100%);
      padding: 28px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .admin-shell img {
      width: min(180px, 55vw);
      height: auto;
      display: block;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-weight: 400;
    }

    p {
      margin: 0;
      color: var(--dim);
      line-height: 1.7;
      font-size: 0.98rem;
    }
  </style>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <div class="admin-shell">
    <img src="/assets/logo-main.png?v=20260331" alt="BAROWO">
    <h1>Panel aktualności</h1>
    <p>W tym panelu dodasz i zaktualizujesz artykuły BAROWO bez ruszania layoutu strony. Każdy wpis jest generowany z
      tego samego szablonu, więc wszystkie publikacje zachowają obecny wygląd i strukturę.</p>
  </div>

  <script>
    (function () {
      var cmsLoaded = false;
      var hasIdentityToken = /(confirmation_token|invite_token|recovery_token|email_change_token)=/.test(window.location.hash || '') ||
        /(confirmation_token|invite_token|recovery_token|email_change_token)=/.test(window.location.search || '');

      if ((!window.location.hash || window.location.hash === '#') && !hasIdentityToken) {
        window.location.replace('/admin/#/');
        return;
      }

      function loadCMS() {
        if (cmsLoaded) return;
        cmsLoaded = true;

        var script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@^3.7.1/dist/decap-cms.js';
        document.body.appendChild(script);
      }

      if (!window.netlifyIdentity) {
        loadCMS();
        return;
      }

      window.netlifyIdentity.on('login', function () {
        document.location.href = '/admin/#/';
      });

      window.netlifyIdentity.on('signup', function () {
        document.location.href = '/admin/#/';
      });

      window.netlifyIdentity.on('init', function (user) {
        if (user) {
          loadCMS();
          return;
        }

        if (hasIdentityToken) {
          setTimeout(function () {
            window.netlifyIdentity.open();
          }, 120);
          return;
        }

        loadCMS();
      });

      window.netlifyIdentity.on('recovery', function () {
        window.netlifyIdentity.open();
      });

      window.netlifyIdentity.on('error', function (err) {
        console.error('Netlify Identity error:', err);
      });
    })();
  </script>
</body>

</html>
